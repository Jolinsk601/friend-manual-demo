<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>开始认识 {{ mock_user.name }} · 朋友说明书</title>
    <link rel="stylesheet" href="/static/app.css?v=1">
    <style>
        .icebreakers-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .icebreaker-card {
            transition: transform 0.2s;
        }
        .icebreaker-card:hover {
            transform: translateY(-2px);
        }
        .topic-tag {
            display: inline-block;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            margin-right: 6px;
        }
        .tag-common { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; }
        .tag-complement { background: rgba(236, 72, 153, 0.2); color: #f9a8d4; }
        .tag-value { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .tag-interest { background: rgba(251, 191, 36, 0.2); color: #fcd34d; }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- ============ 顶部：TA 介绍 ============ -->
        <div class="text-center mb-6 pt-8 fade-in">
            <p class="text-xs text-purple-300 tracking-widest mb-2">AI 帮你开启第一次聊天</p>
            <h1 class="text-3xl font-bold mb-2 gradient-text">认识 {{ mock_user.name }}</h1>
            <p class="text-gray-400 text-sm italic mb-3">"{{ mock_user.one_liner }}"</p>
            <p class="text-xs text-gray-500">
                {{ mock_user.main_type }} · 基于双方"运行参数"匹配
            </p>
        </div>

        <!-- ============ Loading 态（AI 生成中） ============ -->
        <div id="ice-loading" class="hidden">
            <div class="text-center pt-12 fade-in">
                <div class="text-5xl mb-4 animate-pulse">💬</div>
                <h2 class="text-lg font-bold mb-2 gradient-text">AI 正在生成破冰话题</h2>
                <p class="text-gray-400 text-sm mb-4">基于你们双方的说明书</p>
                <div class="flex justify-center gap-2">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>
        </div>

        <!-- ============ 初始态：选 Key / 点生成 ============ -->
        <div id="ice-intro" class="fade-in">
            <div class="app-card-tight p-5 mb-5">
                <p class="text-xs text-gray-500 mb-3 text-center">为什么 AI 觉得你们适合认识？</p>
                <div class="text-center text-sm text-gray-300 leading-relaxed" id="match-summary">
                    加载中...
                </div>
            </div>

            <!-- V1.8.1：不再需要用户输入 API Key，AI_MODE 环境变量自动切换 mock/deepseek -->
            <div class="app-card-tight p-4 mb-5 text-center">
                <p class="text-xs text-gray-400">
                    🎮 当前为 Mock 模式 · 无需 API Key · 直接生成
                </p>
            </div>

            <!-- V1.8.2 页面内按钮移除，底部固定栏负责 -->
            <p class="text-xs text-gray-600 text-center mb-4">
                AI 会基于你们双方的说明书<br>生成 3 条具体可发送的第一句话
            </p>
        </div>

        <!-- ============ 结果态：3 个话题 ============ -->
        <div id="ice-result" class="hidden">
            <div class="text-center mb-4 fade-in">
                <p class="text-xs text-purple-300 mb-1">3 个破冰话题</p>
                <h2 class="text-xl font-bold gradient-text">挑一条直接发，或换个角度</h2>
            </div>

            <div class="icebreakers-list" id="icebreakers-list">
                <!-- 动态填充 -->
            </div>

            <div class="mt-6 text-center space-y-3">
                <button onclick="generateIcebreakers(true)"
                        class="w-full py-3 rounded-2xl bg-white/5 text-gray-300 text-sm hover:bg-white/10 transition">
                    🎲 全部换一个
                </button>
                <a href="/summon/{{ report_id }}"
                   class="block w-full py-3 rounded-2xl bg-white/5 text-gray-400 text-sm hover:bg-white/10 transition">
                    ← 回到召唤结果
                </a>
            </div>
        </div>

        <p class="text-center text-xs text-gray-600 mt-10 mb-4">
            朋友说明书 v1.8 · AI 破冰 Agent
        </p>
    </div>

    <!-- V1.8.2 底部固定操作栏：仅初始态显示 -->
    <div class="bottom-action-bar" id="ice-bottom-bar">
        <button onclick="generateIcebreakers(false)" class="btn-primary btn-lg w-full">
            ✨ 生成破冰话题
        </button>
    </div>

    <script>
        const state = {
            reportId: {{ report_id }},
            mockUserId: "{{ mock_user.id }}",
            mockUserName: "{{ mock_user.name | safe }}",
            // V1.8.1：移除 apiKey，前端不再存 Key
            icebreakers: [],
        };

        // 页面加载：填充匹配摘要
        (function() {
            // 简化版匹配摘要（用 mock_user 已有信息）
            const summary = document.getElementById('match-summary');
            const mockParams = {{ mock_user.params | tojson }};
            summary.innerHTML = `
                <p class="mb-2">TA 的 <span class="text-white">${mockParams.energy || '未知能量'}</span> 和你的能量模式匹配</p>
                <p class="mb-2">TA 喜欢：<span class="text-purple-300">${(mockParams.interests || []).join('、') || '未知'}</span></p>
                <p class="text-xs text-gray-500 mt-3">点击下面按钮，AI 会基于这些信息生成 3 条破冰话题</p>
            `;
        })();

        async function generateIcebreakers(regenerate) {
            // V1.8.1：不再需要前端 API Key

            // 切到 loading
            showSection('loading');

            const url = regenerate
                ? `/api/icebreaker/regenerate/${state.reportId}/${state.mockUserId}`
                : `/api/icebreaker/${state.reportId}/${state.mockUserId}`;

            try {
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({}),  // V1.8.1：不再传 api_key
                });
                const data = await resp.json();
                if (!resp.ok || !data.ok) {
                    throw new Error(data.error || '生成失败');
                }
                state.icebreakers = data.icebreakers || [];
                showSection('result');
                renderIcebreakers();
            } catch (e) {
                // 回退到初始页 + 错误提示
                showSection('intro');
                showToast('❌ ' + e.message);
            }
        }

        function renderIcebreakers() {
            const list = document.getElementById('icebreakers-list');
            list.innerHTML = state.icebreakers.map((ib, idx) => renderCard(ib, idx)).join('');
        }

        function renderCard(ib, idx) {
            const tagMap = {
                '共同点': 'tag-common',
                '互补点': 'tag-complement',
                '兴趣': 'tag-interest',
                '价值观': 'tag-value',
            };
            const tagClass = tagMap[ib.topic_type] || 'tag-common';

            return `
            <div class="icebreaker-card app-card-tight p-5">
                <!-- 为什么推荐 -->
                <div class="mb-3">
                    <span class="topic-tag ${tagClass}">${ib.topic_type || '共同点'}</span>
                    <p class="text-xs text-gray-400 mt-2 leading-relaxed">
                        <span class="text-purple-300">为什么推荐：</span>${escapeHtml(ib.why || '')}
                    </p>
                </div>

                <!-- 话题内容 -->
                <div class="feedback-bubble rounded-xl p-4 mb-3">
                    <p class="text-xs text-purple-300 mb-2">💬 第一句话</p>
                    <p class="text-sm text-white leading-relaxed" id="content-${idx}">${escapeHtml(ib.content || '')}</p>
                </div>

                <!-- 三个按钮 -->
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="directSend(${idx})"
                            class="py-2 rounded-lg bg-purple-500/30 text-purple-200 text-xs hover:bg-purple-500/50 transition">
                        🔥 直接发
                    </button>
                    <button onclick="editContent(${idx})"
                            class="py-2 rounded-lg bg-white/5 text-gray-300 text-xs hover:bg-white/10 transition">
                        ✏️ 修改
                    </button>
                    <button onclick="replaceOne(${idx})"
                            class="py-2 rounded-lg bg-white/5 text-gray-300 text-xs hover:bg-white/10 transition">
                        🎲 换一条
                    </button>
                </div>
            </div>
            `;
        }

        function directSend(idx) {
            const content = state.icebreakers[idx].content;
            // 复制到剪贴板
            navigator.clipboard.writeText(content).then(() => {
                showToast('✓ 已复制，去发给 TA 吧');
            });
        }

        function editContent(idx) {
            const content = state.icebreakers[idx].content;
            const newContent = prompt('修改这句话：', content);
            if (newContent && newContent.trim()) {
                state.icebreakers[idx].content = newContent.trim();
                renderIcebreakers();
                showToast('✓ 已修改');
            }
        }

        async function replaceOne(idx) {
            // 单条替换：暂时用 regenerate 然后过滤掉重复的
            // 简化：直接 regenerate 整个列表
            showToast('🔄 换 3 条');
            await generateIcebreakers(true);
        }

        function showSection(name) {
            ['intro', 'loading', 'result'].forEach(s => {
                document.getElementById(`ice-${s}`).classList.add('hidden');
            });
            document.getElementById(`ice-${name}`).classList.remove('hidden');
            // V1.8.2: 同步控制底部固定栏
            const bar = document.getElementById('ice-bottom-bar');
            if (bar) {
                if (name === 'intro') bar.classList.remove('hidden');
                else bar.classList.add('hidden');
            }
            window.scrollTo(0, 0);
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.cssText = `
                position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
                background: rgba(139, 92, 246, 0.95); color: white;
                padding: 12px 24px; border-radius: 999px; font-size: 14px;
                z-index: 1000; backdrop-filter: blur(10px);
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
